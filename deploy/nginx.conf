# /etc/nginx/sites-available/phim-web  →  symlink into sites-enabled, then: nginx -t && systemctl reload nginx
# Replace movies.example.com. Get a certificate first:  certbot --nginx -d movies.example.com

server {
    listen 80;
    server_name movies.example.com;
    return 301 https://$host$request_uri;       # HTTPS is mandatory
}

server {
    listen 443 ssl;
    http2 on;
    server_name movies.example.com;

    ssl_certificate     /etc/letsencrypt/live/movies.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/movies.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Only small bodies hit the app (poster/subtitle uploads). Video uploads go browser → Google directly.
    client_max_body_size 10m;

    # ---- Video stream: the critical location -------------------------------------------------
    location /api/stream/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # Forward Range / If-Range so seeking works (nginx passes them by default; explicit for clarity).
        proxy_set_header Range    $http_range;
        proxy_set_header If-Range $http_if_range;

        proxy_buffering         off;            # stream straight through, never spool to disk
        proxy_request_buffering off;
        proxy_cache             off;
        proxy_read_timeout      3600s;
        proxy_send_timeout      3600s;
        send_timeout            3600s;
        gzip off;                               # never recompress video

        add_header Cache-Control "private, no-store" always;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_read_timeout 120s;
    }
}
